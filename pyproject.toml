[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapt"
version = "0.23.0"
description = "Persistent conversational memory for AI coding assistants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]==1.28.1",
]
authors = [
    {name = "Layne Penney"},
]

[project.urls]
Homepage = "https://synapt.dev"
Repository = "https://github.com/synapt-dev/recall"

# The MCP server is the base product and its closure stays mandatory above.
# Local model backends and hosted-provider clients are opt-in runtime
# capabilities: importing or running the server must not require their model
# stacks to be present.
[project.optional-dependencies]
server = ["mcp[cli]==1.28.1"]
full-runtime = [
    "sentence-transformers>=2.0",
    "mlx-lm>=0.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "anthropic>=0.70",
    "openai-agents>=0.10",
]
anthropic = ["anthropic>=0.77.0"]
openai = ["openai-agents>=0.10.0"]
google-adk = ["google-adk>=1.0.0"]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=1.4.0"]
all-integrations = [
    "anthropic>=0.77.0",
    "openai-agents>=0.10.0",
    "google-adk>=1.0.0",
    "langchain-core>=0.2",
    "crewai>=1.4.0",
]
hf = ["huggingface_hub>=0.20"]
onnx = ["onnxruntime>=1.16", "optimum[onnxruntime]>=1.16"]
transformers = ["transformers>=4.30", "peft>=0.7"]
extract = ["synapt-extract>=0.6.0"]
x = ["tweepy>=4.14"]
dashboard = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "sse-starlette>=1.0", "markdown>=3.4", "nh3>=0.2.14"]
code-index = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
all = [
    "sentence-transformers>=2.0",
    "mlx-lm>=0.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "sse-starlette>=1.0",
    "markdown>=3.4",
    "nh3>=0.2.14",
    "anthropic>=0.77.0",
    "openai-agents>=0.10.0",
    "google-adk>=1.0.0",
    "langchain-core>=0.2",
    "crewai>=1.4.0",
    "huggingface_hub>=0.20",
    "onnxruntime>=1.16",
    "optimum[onnxruntime]>=1.16",
    "transformers>=4.30",
    "peft>=0.7",
    "synapt-extract>=0.6.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]
# `all` keeps the historical broad installation shape. `full` is the explicit
# spelling for callers that want every runtime and integration capability.
full = [
    "sentence-transformers>=2.0",
    "mlx-lm>=0.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "anthropic>=0.70",
    "openai-agents>=0.10",
    "anthropic>=0.77.0",
    "openai-agents>=0.10.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "sse-starlette>=1.0",
    "markdown>=3.4",
    "nh3>=0.2.14",
    "google-adk>=1.0.0",
    "langchain-core>=0.2",
    "crewai>=1.4.0",
    "huggingface_hub>=0.20",
    "onnxruntime>=1.16",
    "optimum[onnxruntime]>=1.16",
    "transformers>=4.30",
    "peft>=0.7",
    "synapt-extract>=0.6.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]
dev = ["watchfiles>=0.20"]
test = [
    "build>=1.0",
    "pytest>=7.0",
    "tomli>=2.0; python_version < '3.11'",
    "numpy",
    "pytest-benchmark>=4.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "sse-starlette>=1.0",
    "markdown>=3.4",
    "nh3>=0.2.14",
    "synapt-extract>=0.6.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
synapt = "synapt.cli:main"
synapt-dashboard = "synapt.dashboard.app:main"
synapt-recall = "synapt.recall.cli:main"
synapt-recall-server = "synapt.recall.server:main"
synapt-x-server = "synapt.x.server:main"
synapt-convert = "synapt._models.convert:main"

[project.entry-points."synapt.plugins"]
x = "synapt.x.server"
# External plugins register via their own pyproject.toml. Example:
# repair = "synapt_repair.server"

[project.entry-points."synapt.backends"]
# Plugins register model backends here. Each entry point must reference
# a module with a register(register_fn) callable. Example:
# modal = "synapt_private.backends"

[project.entry-points."synapt.commands"]
# Plugins register CLI subcommands here. Each entry point must reference
# a callable main() function. Example:
# repair = "synapt_private.repair.cli:cli_main"

[tool.pytest.ini_options]
addopts = "--benchmark-disable"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"synapt.resources" = ["skills/dev-loop/SKILL.md"]
"synapt.dashboard" = ["template.html"]
