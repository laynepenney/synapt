name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,dashboard]"
      # A collection error in one file (e.g. a TDD tests-only spec ahead of its
      # implementation) otherwise makes pytest refuse to RUN any of the other
      # already-collected tests, zeroing out the whole matrix's signal rather
      # than isolating the one broken file. --continue-on-collection-errors
      # keeps the rest of the suite validating; a genuine collection error
      # still fails the job (pytest's exit code), it just no longer withholds
      # every other test's result along with it.
      - run: pytest tests/ -v --continue-on-collection-errors

  # requirements-mcp.lock is a hand-maintained, scoped lock (see requirements-mcp.in)
  # pinning the mcp SDK across recall's full supported Python range. The unit-tests
  # matrix above never installs it -- it installs directly from pyproject.toml -- so
  # a lock regenerated on a host that silently narrows its own version floor (e.g.
  # a `uv pip compile` run without --python-version/--universal picking a transitive
  # dependency release that requires a newer Python than recall's floor) would not be
  # caught there. This job makes the lock's own installability claim executable.
  mcp-lock-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install --require-hashes -r requirements-mcp.lock
